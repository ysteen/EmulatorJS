<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOSBox Pure EmulatorJS</title>
  <style>
    html, body, #game { width: 100%; height: 100%; margin: 0; background: #000; }
    body { overflow: hidden; }
    #game { display: flex; align-items: center; justify-content: center; }
    #game canvas {
      width: auto !important;
      height: auto !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const gameUrl = params.get("game") || "roms/game.zip";
    const biosUrl = params.get("bios") || "";

    window.EJS_player = "#game";
    window.EJS_core = "dos";
    window.EJS_gameName = gameUrl.split("/").pop().replace(/\.[^.]+$/, "");
    window.EJS_gameUrl = gameUrl;
    window.EJS_biosUrl = biosUrl;
    window.EJS_pathtodata = "data/";
    window.EJS_threads = true;
    window.EJS_startOnLoaded = true;
    window.EJS_volume = 1;
    window.EJS_dontExtractRom = true;
    window.EJS_disableBatchBootup = true;
    window.EJS_fixedSaveInterval = 5000;
    window.EJS_cacheConfig = { enabled: false, cacheMaxSizeMB: 64, cacheMaxAgeMins: 60 };
    // This custom branch intentionally serves source modules, so no minified
    // build artifacts need to be committed to Git.
    window.EJS_DEBUG_XX = true;
  </script>
  <script src="data/loader.js"></script>
</body>
</html>
